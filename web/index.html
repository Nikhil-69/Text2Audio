<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text2Audio Studio</title>
  <link rel="stylesheet" href="/css/studio.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🎧 Text2Audio <span>Studio</span></div>
    <nav class="tabs" role="tablist" aria-label="Studio sections">
      <button class="tab active" role="tab" aria-selected="true" aria-controls="tab-batch" data-tab="batch">Batch</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="tab-library" data-tab="library">Library</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="tab-create" data-tab="create">Single book</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="tab-voices" data-tab="voices">Voices</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="tab-pronounce" data-tab="pronounce">Pronounce</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="tab-help" data-tab="help">Help</button>
    </nav>
    <div id="ffmpeg-warn" class="warn" hidden>⚠ ffmpeg not found</div>
  </header>

  <main>
    <section id="tab-create" role="tabpanel" class="tabpane"></section>
    <section id="tab-batch" role="tabpanel" class="tabpane active"></section>
    <section id="tab-voices" role="tabpanel" class="tabpane"></section>
    <section id="tab-library" role="tabpanel" class="tabpane"></section>
    <section id="tab-pronounce" role="tabpanel" class="tabpane"></section>
    <section id="tab-help" role="tabpanel" class="tabpane"></section>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/create.js"></script>
  <script src="/js/batch.js"></script>
  <script src="/js/voices.js"></script>
  <script src="/js/library.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/pronounce.js"></script>
  <script src="/js/help.js"></script>
</body>
</html>
