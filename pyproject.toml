[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text2audio"
version = "1.4.0"
description = "Free, local, open-source audiobook studio with AI narration and voice cloning."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "mooja77" }]
keywords = ["audiobook", "tts", "text-to-speech", "voice-cloning", "kokoro", "f5-tts"]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "soundfile>=0.12,<1",
    "numpy>=1.24,<3",
    "num2words>=0.5.13,<1",
    "kokoro>=0.9.4,<1",
    "python-multipart>=0.0.9,<1",
    "aiofiles>=23.0,<25",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
clone = ["f5-tts>=1.1,<2"]
classic = ["gradio>=4,<7"]
desktop = ["pywebview>=5"]

[project.urls]
Homepage = "https://github.com/Nikhil-69/Text2Audio"
Repository = "https://github.com/Nikhil-69/Text2Audio"

[project.scripts]
text2audio = "server:main"

[project.gui-scripts]
text2audio-desktop = "desktop:main"

[tool.hatch.build.targets.wheel]
include = ["server.py", "desktop.py", "app.py", "md_to_book.py", "pipeline", "backend", "web", "samples", "assets"]
